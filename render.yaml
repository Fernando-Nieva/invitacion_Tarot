services:
  - type: web
    name: invitacion-tarot
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://invitacion-tarot.onrender.com
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: sqlite
