services:
  - type: web
    name: invitacion-tarot
    runtime: php
    region: oregon
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install && npm run build
      php artisan config:cache
      php artisan view:cache
      touch database/database.sqlite && php artisan migrate --force
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://invitacion-tarot.onrender.com
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: sqlite
